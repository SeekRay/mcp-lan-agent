<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="局域网 MCP Agent 架构图">

  <rect x="48" y="88" width="320" height="200" rx="12" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="68" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#475569">宿主机器 · Mac mini</text>
  
  <text x="68" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">192.168.1.10</text>
  <line x1="68" y1="154" x2="348" y2="154" stroke="#64748b" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="68" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">模型（DeepSeek / Claude）</text>
  <text x="68" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">MCP Client（DSH / Claude Code）</text>
  <text x="68" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">工具命名 mcp__pc__&lt;tool&gt;</text>

  <rect x="592" y="88" width="320" height="200" rx="12" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="612" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#475569">执行机器 · Windows PC</text>
  <circle cx="892" cy="114" r="4" fill="#3f9a68"/>
  <text x="612" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">192.168.1.50</text>
  <line x1="612" y1="154" x2="892" y2="154" stroke="#64748b" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="612" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">pc-agent（Node · 无状态）</text>
  <text x="612" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">文件读写 / 命令 / 后台任务</text>
  <text x="612" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">调用本地程序 · FFmpeg</text>
  <line x1="372" y1="196" x2="574" y2="196" stroke="#5a7fb5" stroke-width="2"/>
  <path d="M 574 189 L 590 196 L 574 203 z" fill="#5a7fb5"/>
  <text x="479" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Streamable HTTP</text>
  <text x="479" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="middle">192.168.1.50:40000/mcp</text>
  <text x="479" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#5a7fb5" text-anchor="middle">内网直连，不做端口映射</text>

  <rect x="48" y="340" width="864" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>

  <text x="156" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">① Bearer token</text>
  <text x="156" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">恒定时间比较</text>

  <text x="372" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">② Host 头校验</text>
  <text x="372" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">防 DNS rebinding</text>

  <text x="588" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">③ IP 白名单</text>
  <text x="588" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">只接受客户端</text>

  <text x="804" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">④ 路径围栏</text>
  <text x="804" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">D:\work 之外拒绝</text>
  <text x="480" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">计划任务 AtStartup + S4U：开机即用，不需要登录，没有控制台窗口</text>
</svg>
