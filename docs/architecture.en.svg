<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="LAN MCP agent architecture">

  <rect x="48" y="88" width="320" height="200" rx="12" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="68" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#475569">Host · Mac mini</text>
  
  <text x="68" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">192.168.1.10</text>
  <line x1="68" y1="154" x2="348" y2="154" stroke="#64748b" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="68" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">Model (DeepSeek / Claude)</text>
  <text x="68" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">MCP client (DSH / Claude Code)</text>
  <text x="68" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">Tools named mcp__pc__&lt;tool&gt;</text>

  <rect x="592" y="88" width="320" height="200" rx="12" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="612" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#475569">Worker · Windows PC</text>
  <circle cx="892" cy="114" r="4" fill="#3f9a68"/>
  <text x="612" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">192.168.1.50</text>
  <line x1="612" y1="154" x2="892" y2="154" stroke="#64748b" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="612" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">pc-agent (Node, stateless)</text>
  <text x="612" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">Files / commands / background jobs</text>
  <text x="612" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">Runs local programs · FFmpeg</text>
  <line x1="372" y1="196" x2="574" y2="196" stroke="#5a7fb5" stroke-width="2"/>
  <path d="M 574 189 L 590 196 L 574 203 z" fill="#5a7fb5"/>
  <text x="479" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Streamable HTTP</text>
  <text x="479" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="middle">192.168.1.50:40000/mcp</text>
  <text x="479" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#5a7fb5" text-anchor="middle">LAN only — never port-forwarded</text>

  <rect x="48" y="340" width="864" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>

  <text x="156" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">1. Bearer token</text>
  <text x="156" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">constant-time compare</text>

  <text x="372" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">2. Host header</text>
  <text x="372" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">DNS-rebinding guard</text>

  <text x="588" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">3. IP allowlist</text>
  <text x="588" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">client machine only</text>

  <text x="804" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">4. Path jail</text>
  <text x="804" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">reject outside D:\work</text>
  <text x="480" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Scheduled task AtStartup + S4U — available at boot, no login, no console window</text>
</svg>
